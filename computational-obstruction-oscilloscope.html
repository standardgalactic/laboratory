<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Computational Obstruction | Audioscope</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#020806;color:#a5e8b6;font:15px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;display:grid;place-items:center;padding:20px}.shell{width:min(920px,100%)}header{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:16px}h1{font-size:clamp(20px,3vw,30px);font-weight:500;letter-spacing:.08em;margin:0}a{color:#8cf6a9;text-decoration:none;border-bottom:1px solid #356c49}a:hover{color:white}.screen{position:relative;border:2px solid #376c4b;border-radius:22px;background:radial-gradient(ellipse at center,#0b2115 0%,#020b07 65%,#010403 100%);box-shadow:0 0 0 7px #06100b,0 0 40px #0b4422;overflow:hidden;aspect-ratio:16/9}.screen:after{content:"";pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,#0003 4px 5px);opacity:.35}canvas{display:block;width:100%;height:100%}.corner{position:absolute;left:22px;top:14px;color:#69b17c;font-size:11px;letter-spacing:.2em}.controls{display:flex;gap:14px;align-items:center;margin-top:25px;flex-wrap:wrap}button{border:1px solid #4c9662;background:#081b10;color:#b9ffd0;padding:10px 17px;font:inherit;cursor:pointer}button:hover{background:#123820}input[type=range]{flex:1;min-width:140px;accent-color:#84ec9d}#time{font-variant-numeric:tabular-nums;min-width:110px;text-align:right}#subtitles{min-height:72px;text-align:center;margin:25px auto 5px;max-width:780px;color:#c5fbd1;font-size:clamp(15px,2vw,19px);text-shadow:0 0 12px #42c16c55}.hint{color:#6a9b7b;font-size:12px;margin-top:12px}audio{display:none}@media(max-width:550px){.controls{gap:10px}#time{min-width:90px}.screen{aspect-ratio:4/3}}</style></head><body><main class="shell"><header><h1>COMPUTATIONAL OBSTRUCTION</h1><a href="https://standardgalactic.github.io/laboratory/computational-obstruction.pdf" target="_blank" rel="noopener">READ ESSAY</a></header><div class="screen"><canvas id="scope"></canvas><div class="corner">LISSAJOUS / AUDIO</div></div><div class="controls"><button id="play" aria-label="Play or pause">PLAY</button><input id="seek" aria-label="Seek audio" type="range" min="0" max="1000" value="0"><span id="time">00:00 / 00:00</span><button id="mute" aria-label="Mute or unmute">SOUND ON</button></div><div id="subtitles" aria-live="off"></div><div class="hint">THE GEOMETRY OF COMPUTATIONAL OBSTRUCTION · SELECT PLAY TO BEGIN</div><audio id="audio" preload="metadata" crossorigin="anonymous"><source src="The_Geometry_of_Computational_Obstruction.mp3" type="audio/mpeg"><track kind="subtitles" src="The_Geometry_of_Computational_Obstruction.vtt" srclang="en" label="English" default></audio></main><script>
(()=>{'use strict';const audio=document.getElementById('audio'),canvas=document.getElementById('scope'),ctx=canvas.getContext('2d'),play=document.getElementById('play'),mute=document.getElementById('mute'),seek=document.getElementById('seek'),time=document.getElementById('time'),subs=document.getElementById('subtitles');let ac,analyser,data,source,started=false,dragging=false,phase=0;function setup(){if(ac)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ac=new AC();analyser=ac.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.82;data=new Uint8Array(analyser.fftSize);source=ac.createMediaElementSource(audio);source.connect(analyser);analyser.connect(ac.destination)}play.addEventListener('click',async()=>{try{setup();if(ac&&ac.state==='suspended')await ac.resume();if(audio.paused)await audio.play();else audio.pause()}catch(e){subs.textContent='Audio unavailable: check the MP3 filename and browser permissions.'}});audio.addEventListener('play',()=>{play.textContent='PAUSE';started=true});audio.addEventListener('pause',()=>play.textContent='PLAY');audio.addEventListener('ended',()=>play.textContent='REPLAY');mute.addEventListener('click',()=>{audio.muted=!audio.muted;mute.textContent=audio.muted?'SOUND OFF':'SOUND ON'});const fmt=s=>{if(!Number.isFinite(s))return'00:00';return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`};function update(){if(!dragging&&Number.isFinite(audio.duration)&&audio.duration>0)seek.value=Math.round(audio.currentTime/audio.duration*1000);time.textContent=`${fmt(audio.currentTime)} / ${fmt(audio.duration)}`}audio.addEventListener('timeupdate',update);audio.addEventListener('loadedmetadata',update);seek.addEventListener('pointerdown',()=>dragging=true);window.addEventListener('pointerup',()=>dragging=false);seek.addEventListener('input',()=>{if(Number.isFinite(audio.duration))audio.currentTime=+seek.value/1000*audio.duration;update()});function captions(){const tracks=audio.textTracks;if(!tracks||!tracks.length)return;const t=tracks[0];if(t.mode==='disabled')t.mode='hidden';let last='';setInterval(()=>{const cues=t.activeCues;let current='';if(cues)for(const cue of cues)current+=(current?' ':'')+cue.text.replace(/<[^>]*>/g,'');if(current!==last){subs.textContent=current;last=current}},160)}audio.addEventListener('loadedmetadata',captions,{once:true});function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d))}window.addEventListener('resize',resize);resize();function draw(){requestAnimationFrame(draw);const w=canvas.width,h=canvas.height;ctx.fillStyle='rgba(1,9,5,.19)';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(w/2,h/2);const scale=Math.min(w,h)*.37;let amp=.12;if(analyser&&!audio.paused){analyser.getByteTimeDomainData(data);let energy=0;for(let i=0;i<data.length;i+=8){const v=(data[i]-128)/128;energy+=v*v}amp=Math.min(1,Math.sqrt(energy/(data.length/8))*5+.15)}phase+=.004+(started&&!audio.paused?.009:0);ctx.beginPath();const n=700;for(let i=0;i<n;i++){const t=i/(n-1)*Math.PI*2;const x=Math.sin(3*t+phase)*scale*(.48+amp*.46);const y=Math.sin(4*t+phase*.77)*scale*(.48+amp*.46);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle='rgba(76,255,132,.12)';ctx.lineWidth=Math.max(6,w/120);ctx.shadowBlur=24;ctx.shadowColor='#5aff90';ctx.stroke();ctx.strokeStyle='rgba(128,255,166,.87)';ctx.lineWidth=Math.max(1.3,w/800);ctx.shadowBlur=12;ctx.stroke();ctx.restore()}draw()})();
</script></body></html>
